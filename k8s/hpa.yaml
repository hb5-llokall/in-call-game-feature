apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dostt-call-games
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dostt-call-games
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
