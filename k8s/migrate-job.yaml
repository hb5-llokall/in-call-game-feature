# Runs `prisma migrate deploy` exactly once per release, before the Deployment
# is rolled. Applied by scripts/deploy.sh with the image tag substituted in.
#
# Using Helm or Argo CD instead? Keep this Job and add one of:
#   helm.sh/hook: pre-install,pre-upgrade      + helm.sh/hook-delete-policy: before-hook-creation
#   argocd.argoproj.io/hook: PreSync           + argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
apiVersion: batch/v1
kind: Job
metadata:
  name: dostt-call-games-migrate-${RELEASE}
  namespace: dostt-games
  labels:
    app: dostt-call-games-migrate
spec:
  # Fail the release rather than retrying a broken migration forever.
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: dostt-call-games-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: ${IMAGE}
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: dostt-call-games-db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
