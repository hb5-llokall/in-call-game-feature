# Not part of the kustomization. Create the real secret out of band, e.g.
#   kubectl -n dostt-games create secret generic dostt-call-games-db \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/dostt_games?schema=public&sslmode=require'
apiVersion: v1
kind: Secret
metadata:
  name: dostt-call-games-db
type: Opaque
stringData:
  DATABASE_URL: postgresql://user:pass@host:5432/dostt_games?schema=public&sslmode=require
